; ─── LD2450 Radar — M5Stack Tab5 ───────────────────────────────────────────
; PlatformIO configuration
;
; Prerequisites:
;   pio pkg install --global --tool toolchain-riscv32-esp   (if not present)
;
; Build:  pio run
; Flash:  pio run --target upload
; .bin:   .pio/build/tab5/firmware.bin  (after `pio run`)
; ────────────────────────────────────────────────────────────────────────────

[env:tab5]
platform     = espressif32 @ ^6.9.0
framework    = arduino
board        = esp32p4dev

; ESP32-P4 specifics
board_build.mcu        = esp32p4
board_build.f_cpu      = 360000000L
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_upload.flash_size = 16MB

; Tell M5Unified this is a Tab5 (MIPI-DSI display init)
build_flags =
    -DARDUINO_M5STACK_TAB5
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    m5stack/M5GFX    @ ^0.2.4

; If esp32p4dev is not yet in your espressif32 version, update platform:
;   pio pkg update --global -p espressif32
